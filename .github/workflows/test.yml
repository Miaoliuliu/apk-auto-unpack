name: test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest
        env:
          AUTO_UNPACK_DISABLE_ARCHIVE: "1"
          AUTO_UNPACK_PRODUCT_ROOT: ${{ runner.temp }}/auto_unpack_products
          AUTO_UNPACK_APK_INBOX: ${{ runner.temp }}/auto_unpack_inbox
